<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Social App | Feed</title>
    <link rel="stylesheet" href="/public/styles.css" />
  </head>
  <body class="min-h-screen bg-gray-50">
    <header class="header-brand">
      <div class="max-w-5xl mx-auto p-4 flex items-center justify-between">
        <a href="/" class="font-bold">SocialApp</a>
        <nav class="hidden sm:flex gap-3">
          <a href="/feed/" class="btn-ghost nav-link-active">Feed</a>
          <a href="/profile/" class="btn-ghost">Profile</a>
        </nav>
        <a
          href="/profile/"
          class="btn-outline bg-white/10 text-white hover:bg-white/20 rounded-lg px-3 py-1.5"
        >
          My profile
        </a>
      </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 space-y-6">
      <!-- Filters -->
      <section class="card p-4 space-y-3">
        <form class="grid gap-3 sm:grid-cols-3">
          <input
            type="search"
            placeholder="Search posts…"
            class="input focus-ring"
          />
          <select class="select focus-ring">
            <option>Sort: Newest</option>
            <option>Oldest</option>
            <option>Most liked</option>
          </select>
          <a href="/profile/" class="btn-outline text-center">My profile</a>
        </form>
      </section>

      <!-- New post -->
      <section class="card p-4">
        <h2 class="font-semibold mb-3">New post</h2>
        <form class="grid gap-3 sm:grid-cols-2">
          <input
            required
            placeholder="Title"
            class="input focus-ring sm:col-span-2"
          />
          <input
            type="url"
            placeholder="Image URL (optional)"
            class="input focus-ring sm:col-span-2"
          />
          <textarea
            required
            placeholder="Text"
            class="textarea focus-ring sm:col-span-2"
          ></textarea>
          <button type="submit" class="btn-primary sm:col-span-2">
            Publish
          </button>
        </form>
      </section>

      <!-- Feed grid -->
      <section class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
        <article class="card overflow-hidden card-hover">
          <img
            src="https://picsum.photos/seed/1/600/400"
            alt=""
            class="card-media"
          />
          <div class="card-body space-y-2">
            <h3 class="font-semibold">Weekend hike</h3>
            <p class="text-sm text-gray-600 line-clamp-3">
              Short description of the post…
            </p>
            <div class="text-xs text-gray-500">By @adrian • 2h</div>
          </div>
        </article>

        <article class="card overflow-hidden card-hover">
          <img
            src="https://picsum.photos/seed/2/600/400"
            alt=""
            class="card-media"
          />
          <div class="card-body space-y-2">
            <h3 class="font-semibold">Coding night</h3>
            <p class="text-sm text-gray-600 line-clamp-3">
              Tailwind makes UI fast.
            </p>
            <div class="text-xs text-gray-500">By @lillepus • 4h</div>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
