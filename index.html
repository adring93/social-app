<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Social App | Login</title>
    <link rel="stylesheet" href="/public/styles.css" />
  </head>
  <body class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
    <main class="w-full max-w-md bg-white shadow-soft rounded-2xl p-6">
      <h1 class="text-2xl font-bold text-center mb-6">Login / Register</h1>

      <form action="/profile" method="get" class="space-y-4" novalidate>
        <div>
          <label for="email" class="block text-sm font-medium mb-1">Email</label>
          <input id="email" name="email" type="email" required class="input focus-ring" />
        </div>

        <div>
          <label for="password" class="block text-sm font-medium mb-1">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            required
            minlength="8"
            class="input focus-ring"
          />
          <p class="text-xs text-gray-500 mt-1">Minimum 8 characters</p>
        </div>

        <button type="submit" class="btn-primary w-full">Continue</button>
      </form>
    </main>
  </body>
</html>
