<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Social App | Logg inn</title>
    <link rel="stylesheet" href="/public/styles.css" />
  </head>
  <body class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
    <main class="w-full max-w-md bg-white shadow rounded-2xl p-6">
      <h1 class="text-2xl font-bold text-center mb-6">Logg inn / Registrer</h1>

      <form action="/profile" method="get" class="space-y-4" novalidate>
        <div>
          <label for="email" class="block text-sm font-medium mb-1">E-post</label>
          <input
            id="email"
            name="email"
            type="email"
            required
            class="w-full rounded-lg border border-gray-300 p-3 focus:outline-none focus:ring focus:ring-blue-200"
          />
        </div>

        <div>
          <label for="password" class="block text-sm font-medium mb-1">Passord</label>
          <input
            id="password"
            name="password"
            type="password"
            required
            minlength="8"
            class="w-full rounded-lg border border-gray-300 p-3 focus:outline-none focus:ring focus:ring-blue-200"
          />
          <p class="text-xs text-gray-500 mt-1">Minst 8 tegn</p>
        </div>

        <button
          type="submit"
          class="w-full rounded-lg bg-blue-600 text-white p-3 font-medium hover:bg-blue-700"
        >
          Fortsett
        </button>
      </form>
    </main>
  </body>
</html>
