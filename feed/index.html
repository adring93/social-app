<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Social App | Feed</title>
    <link rel="stylesheet" href="/public/styles.css" />
  </head>
  <body class="min-h-screen bg-gray-50">
    <header class="bg-white border-b">
      <div class="max-w-5xl mx-auto p-4 flex items-center justify-between">
        <a href="/" class="font-bold">SocialApp</a>
        <nav class="hidden sm:flex gap-4">
          <a href="/feed/" class="text-blue-600 font-medium">Feed</a>
          <a href="/profile/" class="hover:underline">Profil</a>
        </nav>
        <button class="sm:hidden p-2 border rounded">Meny</button>
      </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 space-y-6">
      <section class="bg-white p-4 rounded-2xl shadow space-y-3">
        <form class="grid gap-3 sm:grid-cols-3">
          <input
            type="search"
            placeholder="Søk i poster…"
            class="rounded-lg border p-3"
          />
          <select class="rounded-lg border p-3">
            <option>Sorter: Nyest</option>
            <option>Eldst</option>
            <option>Mest likt</option>
          </select>
          <a href="/profile/" class="rounded-lg border p-3 text-center">
            Min profil
          </a>
        </form>
      </section>

      <section class="bg-white p-4 rounded-2xl shadow">
        <h2 class="font-semibold mb-3">Ny post</h2>
        <form class="grid gap-3 sm:grid-cols-2">
          <input
            required
            placeholder="Tittel"
            class="rounded-lg border p-3 sm:col-span-2"
          />
          <input
            type="url"
            placeholder="Bilde-URL (valgfritt)"
            class="rounded-lg border p-3 sm:col-span-2"
          />
          <textarea
            required
            placeholder="Tekst"
            class="rounded-lg border p-3 sm:col-span-2"
          ></textarea>
          <button
            type="submit"
            class="rounded-lg bg-blue-600 text-white p-3 sm:col-span-2"
          >
            Publiser
          </button>
        </form>
      </section>

      <section class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
        <article class="bg-white rounded-2xl shadow overflow-hidden">
          <img
            src="https://picsum.photos/seed/1/600/400"
            alt=""
            class="w-full h-40 object-cover"
          />
          <div class="p-4 space-y-2">
            <h3 class="font-semibold">Fjelltur i helgen</h3>
            <p class="text-sm text-gray-600 line-clamp-3">
              Kort beskrivelse av posten…
            </p>
            <div class="text-xs text-gray-500">Av @adrian • 2t</div>
          </div>
        </article>
